<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>刑案進度回報</title><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><style>html,body{margin:0;width:100%;height:100%;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif}#app{display:none;width:100%;height:100%;border:0}#loading{display:flex;align-items:center;justify-content:center;height:100%;font-size:18px}.box{padding:28px;background:#fff;border-radius:14px;text-align:center;box-shadow:0 2px 10px #0001}.err{color:#b00020;font-weight:bold}</style></head><body><iframe id="app" name="app"></iframe><div id="loading"><div class="box" id="msg">正在初始化 LINE 登入…</div></div><script>const LIFF_ID='2011257972-LjL6gg4j';const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbxrlijLUE-0cSb86YRJ8CCE9zI5Lc2fq-C9yjnUXxxOPgxfB-vJBlGiPn6hj870cXqXSw/exec';function showError(e){document.getElementById('msg').innerHTML='<div class="err">系統登入失敗</div><p>'+String(e&&e.message||e)+'</p><small>請關閉本頁後，由 LINE 重新開啟系統。</small>';}async function start(){try{await liff.init({liffId:LIFF_ID});if(!liff.isLoggedIn()){liff.login();return;}document.getElementById('msg').textContent='正在驗證身分…';const token=liff.getAccessToken();if(!token)throw Error('無法取得 LINE Access Token');const f=document.createElement('form');f.method='POST';f.action=APPS_SCRIPT_URL;f.target='app';const i=document.createElement('input');i.type='hidden';i.name='accessToken';i.value=token;f.appendChild(i);document.body.appendChild(f);document.getElementById('app').onload=()=>{document.getElementById('loading').style.display='none';document.getElementById('app').style.display='block'};f.submit();}catch(e){showError(e)}}start();</script></body></html>
