<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>刑案進度回報</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft JhengHei",
        sans-serif;

      background: #f5f5f5;
    }


    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      min-height: 100vh;

      padding: 24px;

      box-sizing: border-box;

      text-align: center;
    }


    #loading h2 {
      margin: 0 0 12px 0;
    }


    #loadingStatus {
      color: #666;
      line-height: 1.7;
      word-break: break-all;
    }


    #errorBox {
      display: none;

      width: 100%;
      max-width: 520px;

      box-sizing: border-box;

      margin-top: 20px;
      padding: 16px;

      background: white;

      border-radius: 10px;

      text-align: left;

      line-height: 1.7;

      word-break: break-all;
    }


    #retryButton {
      display: none;

      margin-top: 18px;
      padding: 12px 20px;

      border: 0;
      border-radius: 8px;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }


    #formFrame {
      display: none;

      width: 100%;
      height: 100vh;

      border: 0;

      background: white;
    }

  </style>

</head>


<body>


<!-- =========================
     載入畫面
     ========================= -->

<div id="loading">

  <h2>
    刑案進度回報
  </h2>

  <div id="loadingStatus">
    正在初始化 LINE…
  </div>

  <div id="errorBox"></div>

  <button
    id="retryButton"
    type="button"
    onclick="location.reload()"
  >
    重新載入
  </button>

</div>


<!-- =========================
     Apps Script 表單 iframe
     ========================= -->

<iframe
  id="formFrame"
  allow="clipboard-write"
></iframe>



<script>


  /* ==========================================================
     你只需要修改這兩個值
     ========================================================== */

  const LIFF_ID =
    '2011257972-LjL6gg4j';


  const APPS_SCRIPT_URL =
    'https://script.google.com/macros/s/AKfycbxrlijLUE-0cSb86YRJ8CCE9zI5Lc2fq-C9yjnUXxxOPgxfB-vJBlGiPn6hj870cXqXSw/exec';



  /* ==========================================================
     LINE 使用者資料
     ========================================================== */

  let lineProfile = {

    displayName: '',
    userId: ''

  };



  /* ==========================================================
     LIFF 初始化
     ========================================================== */

  async function initialize() {

    const loadingStatus =
      document.getElementById(
        'loadingStatus'
      );

    const errorBox =
      document.getElementById(
        'errorBox'
      );

    const retryButton =
      document.getElementById(
        'retryButton'
      );


    try {

      loadingStatus.textContent =
        '正在初始化 LIFF…';


      /*
       * 確認 SDK 是否存在
       */

      if (
        typeof liff ===
        'undefined'
      ) {

        throw new Error(
          'LIFF SDK 載入失敗'
        );

      }


      /*
       * 初始化 LIFF
       */

      await liff.init({

        liffId: LIFF_ID

      });


      /*
       * 若未登入 LINE
       */

      if (
        !liff.isLoggedIn()
      ) {

        loadingStatus.textContent =
          '正在登入 LINE…';


        liff.login({

          redirectUri:
            window.location.href

        });


        return;

      }


      /*
       * 取得 Profile
       */

      loadingStatus.textContent =
        '正在取得 LINE 使用者資料…';


      const profile =
        await liff.getProfile();


      lineProfile.displayName =
        String(
          profile.displayName || ''
        ).trim();


      lineProfile.userId =
        String(
          profile.userId || ''
        ).trim();


      /*
       * 基本檢查
       */

      if (
        !lineProfile.userId
      ) {

        throw new Error(
          'LINE User ID 取得失敗'
        );

      }


      /*
       * 顯示確認
       */

      loadingStatus.innerHTML =

        'LINE 身分確認成功' +

        '<br>' +

        escapeHtml(
          lineProfile.displayName ||
          '未取得名稱'
        );


      /*
       * 載入 Apps Script 表單
       */

      loadAppsScriptForm();


    }

    catch (error) {

      console.error(
        error
      );


      loadingStatus.textContent =
        'LINE 初始化失敗';


      errorBox.style.display =
        'block';


      retryButton.style.display =
        'inline-block';


      errorBox.innerHTML =

        '<strong>錯誤訊息：</strong>' +

        '<br>' +

        escapeHtml(
          error.message ||
          String(error)
        )

        +

        '<br><br>' +

        '<strong>目前網址：</strong>' +

        '<br>' +

        escapeHtml(
          window.location.href
        );

    }

  }



  /* ==========================================================
     載入 Apps Script 表單
     ========================================================== */

  function loadAppsScriptForm() {

    const iframe =
      document.getElementById(
        'formFrame'
      );


    const loading =
      document.getElementById(
        'loading'
      );


    const loadingStatus =
      document.getElementById(
        'loadingStatus'
      );


    /*
     * 檢查 Apps Script URL
     */

    if (
      !APPS_SCRIPT_URL
      ||
      APPS_SCRIPT_URL.includes(
        '你的AppsScript'
      )
    ) {

      throw new Error(
        '尚未設定 Apps Script Web App URL'
      );

    }


    /*
     * 建立 URL
     */

    const url =
      new URL(
        APPS_SCRIPT_URL
      );


    /*
     * 把 LINE Profile 放進查詢參數
     */

    url.searchParams.set(

      'lineDisplayName',

      lineProfile.displayName

    );


    url.searchParams.set(

      'lineUserId',

      lineProfile.userId

    );


    /*
     * 加入一個時間參數，
     * 避免 iframe 讀到舊快取
     */

    url.searchParams.set(

      '_t',

      Date.now().toString()

    );


    loadingStatus.textContent =
      '正在載入回報表單…';


    /*
     * 設定 iframe
     */

    iframe.src =
      url.toString();


    /*
     * Apps Script 載入完成
     */

    iframe.onload =
      function() {


        loading.style.display =
          'none';


        iframe.style.display =
          'block';


      };

  }



  /* ==========================================================
     HTML escape
     ========================================================== */

  function escapeHtml(value) {

    return String(
      value || ''
    )

      .replaceAll(
        '&',
        '&amp;'
      )

      .replaceAll(
        '<',
        '&lt;'
      )

      .replaceAll(
        '>',
        '&gt;'
      )

      .replaceAll(
        '"',
        '&quot;'
      )

      .replaceAll(
        "'",
        '&#039;'
      );

  }



  /* ==========================================================
     啟動
     ========================================================== */

  initialize();


</script>


</body>

</html>
